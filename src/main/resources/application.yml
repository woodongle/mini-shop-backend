spring:
  datasource:
    url: 'jdbc:h2:tcp://localhost/~/test'
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Seoul

logging.level:
  org.hibernate.SQL: debug
  org.springframework.security: debug

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration-ms: 3600000  # 1시간 (엑세스 토큰)
  refresh-expiration-ms: 604800000  # 7일 (리프레시 토큰)